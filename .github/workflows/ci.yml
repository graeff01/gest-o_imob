name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestao-imob
    env:
      APP_ENV: local
      NEXT_PUBLIC_APP_ENV: local
      AUTH_SECRET: ci-local-secret-not-for-production
      AUTH_ADMIN_EMAIL: admin@example.com
      AUTH_ADMIN_HASH: "$2b$12$PHvw9V0bUV1a3fX7vZr6Y.nvk8Y.1e8ebjSNjiKQczV0VOjoWfVAu"
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      GATEWAY_STUB_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestao-imob/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify:ci
